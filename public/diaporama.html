<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Défis Photo - Diaporama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { font-size: 20px; } /* base agrandie pour projecteur 1920px */

    body {
      background: #0a0730;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Instrument Sans', sans-serif;
      overflow: hidden;
    }

    .slide {
      width: 1920px;
      height: 1080px;
      background: #0e0b3d;
      background-image:
        radial-gradient(at 0%   0%,   #2a1fb8 0, transparent 50%),
        radial-gradient(at 100% 0%,   #3b2fe0 0, transparent 45%),
        radial-gradient(at 50%  100%, #0a0730 0, transparent 55%),
        radial-gradient(at 100% 100%, #241a9a 0, transparent 45%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: stretch;
    }

    /* Grains décoratifs */
    .slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle 2px   at 8%  15%, rgba(255,233,74,0.5)  0%, transparent 100%),
        radial-gradient(circle 1.5px at 22% 65%, rgba(255,255,255,0.4)  0%, transparent 100%),
        radial-gradient(circle 3px   at 78% 20%, rgba(255,233,74,0.4) 0%, transparent 100%),
        radial-gradient(circle 1.5px at 88% 80%, rgba(255,255,255,0.4)  0%, transparent 100%),
        radial-gradient(circle 2px   at 95% 10%, rgba(255,233,74,0.5)  0%, transparent 100%),
        radial-gradient(circle 1.5px at 15% 90%, rgba(255,255,255,0.3)  0%, transparent 100%),
        radial-gradient(circle 2.5px at 55% 45%, rgba(255,233,74,0.3) 0%, transparent 100%),
        radial-gradient(circle 1.5px at 40% 78%, rgba(255,233,74,0.3)  0%, transparent 100%),
        radial-gradient(circle 1px   at 65% 92%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(circle 2px   at 32% 30%, rgba(255,233,74,0.3) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Cercles déco */
    .deco-circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .deco-circle-1 {
      width: 600px; height: 600px;
      top: -200px; right: -200px;
      background: radial-gradient(circle, rgba(255,233,74,0.1) 0%, transparent 70%);
    }
    .deco-circle-2 {
      width: 480px; height: 480px;
      bottom: -160px; left: -160px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    }

    /* ── Colonne gauche ────────────────────────────────── */
    .left-col {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 80px 60px 100px;
      gap: 28px;
      position: relative;
      z-index: 1;
    }

    .badge {
      font-size: 1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffe94a;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 999px;
      padding: 10px 28px;
    }

    .photo-ring {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #ffe94a, #ffe94a, #ffe94a);
      filter: drop-shadow(0 0 24px rgba(255,233,74,0.4));
      flex-shrink: 0;
    }
    .photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #0e0b3d;
    }
    .photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .title-block {
      text-align: center;
    }
    .title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 4.2rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.05;
      margin-bottom: 10px;
    }
    .title em {
      font-style: normal;
      color: #ffe94a;
    }
    .subtitle {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 2.2rem;
      font-style: normal;
      color: #ffe94a;
      letter-spacing: 0.02em;
    }

    /* Grille des défis */
    .challenges-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }
    .chip {
      background: rgba(10,7,48,0.75);
      border: 1px solid rgba(255,233,74,0.25);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .chip .icon { font-size: 1.8rem; display: block; margin-bottom: 6px; }
    .chip .name { font-size: 0.9rem; color: #ffffff; font-weight: 600; line-height: 1.2; }

    /* ── Séparateur vertical ────────────────────────────── */
    .separator {
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5), transparent);
      align-self: stretch;
      margin: 60px 0;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    /* ── Colonne droite ────────────────────────────────── */
    .right-col {
      flex: 0.8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 100px 60px 80px;
      gap: 28px;
      position: relative;
      z-index: 1;
    }

    .qr-label {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
    }

    .qr-box {
      width: 340px;
      height: 340px;
      background: #fff;
      border-radius: 18px;
      padding: 10px;
      filter: drop-shadow(0 0 32px rgba(255,255,255,0.15));
      flex-shrink: 0;
    }
    .qr-box img { width: 100%; height: 100%; display: block; }

    .qr-desc {
      text-align: center;
    }
    .qr-desc p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      margin-bottom: 12px;
    }
    /* Confetti layer */
    .confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Ligne déco bas */
    .bottom-line {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 80px;
      z-index: 1;
    }
    .bottom-line::before,
    .bottom-line::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.35), transparent);
    }
    .bottom-line span {
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="confetti-layer" id="confetti"></div>
    <div class="deco-circle deco-circle-1"></div>
    <div class="deco-circle deco-circle-2"></div>

    <!-- Colonne gauche -->
    <div class="left-col">
      <div class="badge">🎉 Soirée anniversaire 🎉</div>

      <div class="photo-ring">
        <div class="photo-inner">
          <img src="https://placehold.co/400x400" alt="Photo" onerror="this.parentElement.style.background='linear-gradient(135deg,#241a9a,#0e0b3d)'" />
        </div>
      </div>

      <div class="title-block">
        <h1 class="title">Les défis photo<br>de la <em>soirée</em></h1>
        <p class="subtitle">30 ans !</p>
      </div>

      <div class="challenges-grid">
        <div class="chip"><span class="icon">🌅</span><span class="name">Heure dorée</span></div>
        <div class="chip"><span class="icon">🪞</span><span class="name">Reflet</span></div>
        <div class="chip"><span class="icon">🔬</span><span class="name">Minuscule</span></div>
        <div class="chip"><span class="icon">📐</span><span class="name">Géométrie</span></div>
        <div class="chip"><span class="icon">⬛</span><span class="name">Monochrome</span></div>
        <div class="chip"><span class="icon">💨</span><span class="name">Mouvement</span></div>
        <div class="chip"><span class="icon">🧍</span><span class="name">Portrait</span></div>
        <div class="chip"><span class="icon">🍎</span><span class="name">Nature morte</span></div>
      </div>
    </div>

    <!-- Séparateur -->
    <div class="separator"></div>

    <!-- Colonne droite -->
    <div class="right-col">
      <p class="qr-label">📱 Scanne pour participer</p>

      <div class="qr-box">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=512x512&data=https%3A%2F%2Fdefis-photo.vercel.app%2F&bgcolor=ffffff&color=1a0510&margin=4&qzone=1"
          alt="QR Code"
        />
      </div>

      <div class="qr-desc">
        <p>Inscris-toi, prends tes photos<br>et rejoins la galerie en direct&nbsp;!</p>
      </div>
    </div>

    <div class="bottom-line">
      <span>📸 Bonne chance à tous 📸</span>
    </div>
  </div>
  <script>
    const COLORS = ['#ffe94a','#ffffff','#ff6a5a','#8f86ff','#ffe94a','#ffffff','#ff6a5a','#8f86ff','#ffe94a','#ffffff','#ff6a5a'];
    const SHAPES = ['circle','rect','ribbon','rect','circle'];
    const EMOJIS = ['🎈','🎁','📷','🎀','🎊','🎉','🎈','🎁','📸','🎈'];
    const EMOJI_COUNT = 20;
    const SLOT = 100 / EMOJI_COUNT;

    const confettiData = Array.from({ length: 70 }, (_, i) => ({
      left:     (i * 1.45 + (i % 8) * 2.9) % 100,
      color:    COLORS[i % COLORS.length],
      shape:    SHAPES[i % SHAPES.length],
      size:     5 + (i % 6) * 2.2,
      delay:    (i * 0.19) % 5,
      duration: 12 + (i % 7) * 2,
      drift:    ((i % 11) - 5) * 28,
      startY:   -((i % 7) * 16 + 8),
    }));

    const emojiData = Array.from({ length: EMOJI_COUNT }, (_, i) => ({
      emoji:     EMOJIS[i % EMOJIS.length],
      left:      i * SLOT + SLOT / 2 + (i % 3 - 1) * 1.2,
      size:      20 + (i % 4) * 7,
      delay:     (i * 0.6) % 8,
      duration:  10 + (i % 5) * 1.8,
      drift:     ((i % 3) - 1) * (SLOT * 0.35),
      isBalloon: i % EMOJIS.length === 0 || i % EMOJIS.length === 7,
    }));

    // Génération des keyframes CSS
    let cssRules = '';
    confettiData.forEach((p, i) => {
      cssRules += `
        @keyframes fall${i} {
          0%   { transform: translateX(0px)           translateY(${p.startY}px) rotate(0deg);   opacity: 0; }
          10%  { opacity: 0.75; }
          80%  { opacity: 0.75; }
          100% { transform: translateX(${p.drift}px)  translateY(110vh)         rotate(360deg); opacity: 0; }
        }`;
    });
    emojiData.forEach((p, i) => {
      if (p.isBalloon) {
        cssRules += `
        @keyframes rise${i} {
          0%   { transform: translateX(0px) translateY(110vh);  opacity: 0; }
          10%  { opacity: 0.55; }
          40%  { transform: translateX(${p.drift * 0.4}px)  translateY(60vh);  opacity: 0.55; }
          70%  { transform: translateX(${-p.drift * 0.3}px) translateY(20vh);  opacity: 0.55; }
          90%  { opacity: 0.55; }
          100% { transform: translateX(${p.drift * 0.2}px)  translateY(-10vh); opacity: 0; }
        }`;
      } else {
        cssRules += `
        @keyframes drop${i} {
          0%   { transform: translateX(0px)          translateY(0)    rotate(-8deg) scale(0.9); opacity: 0; }
          10%  { opacity: 0.55; }
          80%  { opacity: 0.55; }
          100% { transform: translateX(${p.drift}px) translateY(110vh) rotate(10deg) scale(1);  opacity: 0; }
        }`;
      }
    });
    const styleEl = document.createElement('style');
    styleEl.textContent = cssRules;
    document.head.appendChild(styleEl);

    const container = document.getElementById('confetti');

    // Confettis
    confettiData.forEach((p, i) => {
      const el = document.createElement('div');
      const isRibbon = p.shape === 'ribbon';
      const w = isRibbon ? Math.max(3, p.size * 0.32) : p.size;
      const h = isRibbon ? p.size * 2.6 : p.size;
      el.style.cssText = `position:absolute;left:${p.left}%;top:0;width:${w}px;height:${h}px;border-radius:${p.shape==='circle'?'50%':'2px'};background:${p.color};animation:fall${i} ${p.duration}s ${p.delay}s infinite linear;`;
      container.appendChild(el);
    });

    // Emojis
    emojiData.forEach((p, i) => {
      const el = document.createElement('div');
      el.textContent = p.emoji;
      const anim = p.isBalloon ? `rise${i}` : `drop${i}`;
      el.style.cssText = `position:absolute;left:${p.left}%;top:0;font-size:${p.size}px;line-height:1;user-select:none;animation:${anim} ${p.duration}s ${p.delay}s infinite ease-in-out;`;
      container.appendChild(el);
    });
  </script>
</body>
</html>
