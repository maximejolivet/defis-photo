security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: pseudo

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    # Only the *first* matching rule is applied.
    access_control:
        - { path: ^/api/photos/upload, roles: ROLE_USER }
        - { path: ^/api/photos/delete, roles: ROLE_USER }
        - { path: ^/api/gamification/stats, roles: ROLE_USER }
        - { path: ^/api, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
